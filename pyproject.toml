[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "MLATE"
version = "0.1.1"
description = "Multi-dimensional Literature Analysis and Thematic Exploration"
authors = [{name = "naclcode"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "openai>=1.0",
    "pandas>=1.0",
    "openpyxl",
    "xlrd",
    "tqdm",
]

[project.scripts]
mlate = "mlate.cli:main"

[tool.setuptools]
packages = ["mlate", "mlate.stages"]
package-dir = { "mlate" = "." }

[tool.setuptools.package-data]
"mlate" = ["prompts/*.md"]